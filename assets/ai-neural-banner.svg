<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.42"/>
      <stop offset="55%" stop-color="#2563EB" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8FAFC" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="160" y1="48" x2="1030" y2="308">
      <stop stop-color="#F8FAFC" stop-opacity="0.06"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.46"/>
      <stop offset="1" stop-color="#F8FAFC" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="card" x1="130" y1="74" x2="1070" y2="300">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <filter id="nodeGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      .pulse2 { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
      .dash { stroke-dasharray: 10 18; animation: dash 7s linear infinite; }
      .float { animation: float 6s ease-in-out infinite; }
      @keyframes pulse {
        0%, 100% { opacity: .46; transform: scale(1); }
        50% { opacity: 1; transform: scale(1.35); }
      }
      @keyframes dash {
        to { stroke-dashoffset: -180; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#020617"/>
  <rect x="1" y="1" width="1198" height="358" rx="27" stroke="#1E293B"/>
  <circle cx="262" cy="132" r="190" fill="url(#glowA)" filter="url(#blur)"/>
  <circle cx="982" cy="240" r="220" fill="url(#glowB)" filter="url(#blur)"/>

  <g opacity="0.46">
    <path class="dash" d="M190 112 C320 46 418 206 560 130 C712 48 812 250 1010 102" stroke="url(#line)" stroke-width="2"/>
    <path class="dash" d="M160 238 C330 310 420 78 610 210 C770 320 870 92 1040 250" stroke="url(#line)" stroke-width="2"/>
    <path class="dash" d="M230 180 C390 116 498 284 642 158 C780 38 932 168 1026 144" stroke="#60A5FA" stroke-opacity="0.28" stroke-width="1.5"/>
  </g>

  <g filter="url(#nodeGlow)">
    <circle class="pulse" cx="190" cy="112" r="5" fill="#F8FAFC"/>
    <circle class="pulse2" cx="340" cy="78" r="6" fill="#60A5FA"/>
    <circle class="pulse" cx="560" cy="130" r="5" fill="#93C5FD"/>
    <circle class="pulse2" cx="760" cy="156" r="7" fill="#F8FAFC"/>
    <circle class="pulse" cx="1010" cy="102" r="5" fill="#60A5FA"/>
    <circle class="pulse2" cx="160" cy="238" r="5" fill="#60A5FA"/>
    <circle class="pulse" cx="610" cy="210" r="6" fill="#F8FAFC"/>
    <circle class="pulse2" cx="1040" cy="250" r="5" fill="#93C5FD"/>
  </g>

  <g class="float">
    <rect x="138" y="84" width="924" height="192" rx="22" fill="url(#card)" fill-opacity="0.72" stroke="#334155"/>
    <text x="174" y="142" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="38" font-weight="800">Lucas Lima | devlucaslim4</text>
    <text x="176" y="184" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">IA aplicada, automacao com Python e interfaces digitais modernas.</text>
    <text x="176" y="228" fill="#60A5FA" font-family="JetBrains Mono, Consolas, monospace" font-size="17">processos -&gt; automacao -&gt; inteligencia -&gt; experiencia digital</text>
    <rect x="176" y="246" width="128" height="2" rx="1" fill="#60A5FA"/>
  </g>
</svg>
