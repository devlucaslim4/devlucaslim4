<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="70" x2="1080" y2="230">
      <stop stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#60A5FA" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#1E293B" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .flow { stroke-dasharray: 10 18; animation: flow 8s linear infinite; }
      .pulse { animation: pulse 2.8s ease-in-out infinite; }
      @keyframes flow { to { stroke-dashoffset: -180; } }
      @keyframes pulse { 0%,100%{opacity:.4} 50%{opacity:1} }
    </style>
  </defs>

  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="298" rx="21" stroke="#1E293B"/>

  <path class="flow" d="M100 92H290C322 92 322 148 354 148H520C552 148 552 92 584 92H1100" stroke="url(#accent)" stroke-width="2"/>
  <path class="flow" d="M100 208H270C302 208 302 166 334 166H500C532 166 532 208 564 208H1100" stroke="url(#accent)" stroke-width="2"/>
  <path d="M100 150H1100" stroke="#1E293B"/>

  <g filter="url(#glow)">
    <circle class="pulse" cx="290" cy="92" r="5" fill="#60A5FA"/>
    <circle class="pulse" cx="520" cy="148" r="5" fill="#F8FAFC"/>
    <circle class="pulse" cx="584" cy="92" r="5" fill="#60A5FA"/>
    <circle class="pulse" cx="270" cy="208" r="5" fill="#F8FAFC"/>
    <circle class="pulse" cx="500" cy="166" r="5" fill="#60A5FA"/>
    <circle class="pulse" cx="564" cy="208" r="5" fill="#F8FAFC"/>
  </g>

  <rect x="116" y="66" width="968" height="168" rx="16" fill="#020617" fill-opacity="0.78" stroke="#334155"/>
  <text x="154" y="124" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="36" font-weight="800">Lucas Lima | Back-end Developer</text>
  <text x="156" y="164" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Python, Django, Flask, FastAPI, PHP, Laravel, Node.js e bancos SQL.</text>
  <text x="156" y="202" fill="#60A5FA" font-family="JetBrains Mono, Consolas, monospace" font-size="16">APIs / lógica server-side / bancos de dados / sistemas escaláveis</text>
</svg>
